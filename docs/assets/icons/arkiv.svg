<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Arkiv launcher icon: the drawer front with the red slip. Full preview with the rounded-square mask baked in. -->
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4EFE6"/>
      <stop offset="1" stop-color="#E0D8C9"/>
    </linearGradient>
    <radialGradient id="light" cx="0.32" cy="0.02" r="1">
      <stop offset="0" stop-color="#FFFCF4" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#FFFCF4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.62" stop-color="#F6F3EE"/>
      <stop offset="1" stop-color="#ECE7DD"/>
    </linearGradient>
    <linearGradient id="oak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E2C59A"/>
      <stop offset="0.5" stop-color="#C2A171"/>
      <stop offset="1" stop-color="#9E7F53"/>
    </linearGradient>
    <linearGradient id="slip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ED8B7D"/>
      <stop offset="1" stop-color="#D96A5B"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#4A3A22" flood-opacity="0.28"/>
    </filter>
    <filter id="small" x="-40%" y="-40%" width="180%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#4A3A22" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="115" fill="url(#wall)"/>
  <rect width="512" height="512" rx="115" fill="url(#light)"/>

  <!-- the red slip, peeking from the drawer gap -->
  <g transform="rotate(-3 352 150)">
    <rect x="318" y="104" width="68" height="66" rx="8" fill="url(#slip)" filter="url(#small)"/>
  </g>

  <!-- the drawer front -->
  <rect x="72" y="146" width="368" height="238" rx="38" fill="url(#front)" filter="url(#drop)"/>
  <rect x="75" y="149" width="362" height="232" rx="35" fill="none" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="4"/>
  <rect x="74" y="148" width="364" height="234" rx="36" fill="none" stroke="#CFC5B2" stroke-opacity="0.55" stroke-width="2"/>

  <!-- the oak handle -->
  <rect x="166" y="290" width="180" height="34" rx="17" fill="url(#oak)" filter="url(#small)"/>
  <rect x="174" y="295" width="164" height="9" rx="4.5" fill="#F0DDBB" opacity="0.65"/>
  <circle cx="182" cy="307" r="5" fill="#8A6E47"/>
  <circle cx="330" cy="307" r="5" fill="#8A6E47"/>
</svg>
